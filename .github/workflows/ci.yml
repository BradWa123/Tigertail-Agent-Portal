# Runs on every push and pull request. Railway's "Wait for CI" holds the deploy
# until these pass, so a failing check means production is left as it was.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 4 * * *"  # nightly, so newly published advisories (npm audit) fail the next morning
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    # Scans new commits only; a scheduled run would rescan all history (which holds since-rotated secrets)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The official gitleaks binary, pinned and checksum-verified — no third-party
      # action that can change or break underneath us
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfL -o checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' checksums.txt | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      # Scans only the commits in this push / PR for keys, tokens and passwords
      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then RANGE="$PR_BASE..$PR_HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then RANGE="$SHA~1..$SHA"
          else RANGE="$BEFORE..$SHA"; fi
          echo "Scanning $RANGE"
          ./gitleaks git --log-opts="$RANGE" --redact --no-banner --exit-code 1

  agent-portal:
    name: Build + security checks (.)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      NEXT_PUBLIC_API_URL: https://api.tigertaillogistics.com
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./package-lock.json
      - run: npm ci
      - name: No high/critical vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: No secrets in bundles; security headers served
        run: bash $GITHUB_WORKSPACE/.github/scripts/check-build.sh
        env:
          EXPECT_CONNECT_SRC: "https://api.tigertaillogistics.com"
